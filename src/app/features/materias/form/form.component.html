<div class="page-container">
  <div class="container">
    <div class="section-header">
      <h2>Inscripci&oacute;n de Materias</h2>
      <p>Registra una nueva materia en el sistema</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card-custom">
          <div class="card-body p-4">
            <form [formGroup]="materiasForm" (ngSubmit)="onSubmit()" class="form-custom">
              <div class="mb-3">
                <label for="codigo" class="form-label">C&oacute;digo Estudiante</label>
                <input type="text" id="codigo" class="form-control" formControlName="codigo" placeholder="Ej: 2025001" />
                <div *ngIf="materiasForm.get('codigo')?.invalid && materiasForm.get('codigo')?.touched" class="text-danger small">El c&oacute;digo es obligatorio (m&iacute;nimo 4 caracteres).</div>
              </div>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Estudiante</label>
                <input type="text" id="nombre" class="form-control" formControlName="nombre" placeholder="Ej: Laura P&eacute;rez" />
                <div *ngIf="materiasForm.get('nombre')?.invalid && materiasForm.get('nombre')?.touched" class="text-danger small">El nombre es obligatorio.</div>
              </div>
              <div class="mb-3">
                <label for="materia" class="form-label">Materia</label>
                <select id="materia" class="form-select" formControlName="materia">
                  <option value="" disabled selected>Seleccione una materia</option>
                  <option *ngFor="let mat of materiasDisponibles" [value]="mat">{{ mat }}</option>
                </select>
                <div *ngIf="materiasForm.get('materia')?.invalid && materiasForm.get('materia')?.touched" class="text-danger small">Debe seleccionar una materia.</div>
              </div>
              <div class="mb-3">
                <label for="semestre" class="form-label">Semestre</label>
                <input type="number" id="semestre" class="form-control" formControlName="semestre" placeholder="Ej: 3" />
                <div *ngIf="materiasForm.get('semestre')?.invalid && materiasForm.get('semestre')?.touched" class="text-danger small">El semestre es obligatorio y debe ser un n&uacute;mero v&aacute;lido.</div>
              </div>
              <div class="d-flex gap-2 justify-content-end mt-3">
                <button type="submit" class="btn btn-custom-primary" [disabled]="materiasForm.invalid">Inscribirse</button>
                <button type="button" class="btn btn-custom-outline" routerLink="/materias">Cancelar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
